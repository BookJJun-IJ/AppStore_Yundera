# wger's static and media files are written by the app container into two shared
# bind mounts and served from here; everything else is proxied to gunicorn.
# Django with DEBUG=False serves neither, and wger ships no whitenoise, so this
# front-end is required, not an optimisation.
#
# Adapted from wger-project/docker config/nginx.conf. Two changes:
#   * the `powersync` upstream and its /ps/ location are gone with the service
#     (see rationale.md); nginx refuses to start on an unresolvable upstream, so
#     the block cannot simply be left in place.
#   * the app is reached through a runtime-resolved variable rather than an
#     `upstream` block. nginx resolves an upstream name once, at startup, and
#     exits if it fails -- which is what happens whenever this container is
#     started before the app container, e.g. after a host reboot, where the
#     daemon's restart order does not follow compose's `depends_on`.

# Docker's embedded DNS. `valid=10s` re-resolves, so a recreated app container
# is picked up without restarting this one.
resolver 127.0.0.11 valid=10s ipv6=off;

# Use the value the edge proxy sent when there is one, fall back to our own
# scheme for a direct connection.
map $http_x_forwarded_proto $final_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Only send `Connection: upgrade` on a request that actually asked for it;
# sending it unconditionally breaks keepalive on every ordinary request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    access_log /dev/stdout combined;

    # Videos and exercise images are uploaded through the app.
    client_max_body_size 100M;

    location / {
        # Resolved per request, not at startup -- see the note above. With a
        # variable in proxy_pass nginx no longer appends the original URI by
        # itself, hence the explicit $request_uri.
        set $wger_backend "http://wger-web:8000";
        proxy_pass $wger_backend$request_uri;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_redirect off;
        proxy_http_version 1.1;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /static/ {
        alias /wger/static/;

        # collectstatic writes hashed filenames, so these are immutable.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
    }

    location /media/ {
        alias /wger/media/;
    }
}
