  title:
    en_us: Vaultwarden
  tips:
    before_install:
      en_us: |
        `If you lose your master password, **NOBODY CAN RECOVER YOUR DATA**! Your vault will be permanently inaccessible. Store it in a safe place.`

        **Admin Panel**

        | Setting | Value |
        |---------|-------|
        | Admin Panel | [🔗 Admin Panel](https://vaultwarden-$APP_DOMAIN/admin) |
        | Sign in with | Your Yundera account (single sign-on) |

        There is **no admin token** to copy or keep safe: the admin panel is protected by this
        server's single sign-on. Anyone who can sign in to this server can open it, so treat it
        as an owner-only page.

        Note: the admin panel does not give access to user vaults --- only the user master password does.

        **Signing in**

        Opening the vault in a **web browser** asks for your Yundera login first, then your vault
        master password. The **Bitwarden apps and browser extensions connect directly** and are
        not affected --- they keep using your Vaultwarden email and master password as before.

        **First Steps:**

        1. **Create your main account**: After installation, create your first user account via signup.

        2. **Access Admin Panel**: [🔗 Admin Panel](https://vaultwarden-$APP_DOMAIN/admin)

        3. **Secure your instance**: Disable new signups in admin panel once set up.

        **For Mobile/Desktop Apps:**

        Download the **Bitwarden app** or use the **Bitwarden browser extension** - works perfectly with Vaultwarden!
      ko_kr: |
        `마스터 비밀번호를 분실하면 **아무도 데이터를 복구할 수 없습니다**! 보관함에 영구적으로 접근할 수 없게 됩니다. 안전한 곳에 보관하세요.`

        **관리자 패널**

        | 설정 | 값 |
        |------|-----|
        | 관리자 패널 | [🔗 관리자 패널](https://vaultwarden-$APP_DOMAIN/admin) |
        | 로그인 방법 | Yundera 계정 (통합 인증) |

        보관해야 할 **관리자 토큰이 없습니다**: 관리자 패널은 이 서버의 통합 인증(SSO)으로 보호됩니다.
        이 서버에 로그인할 수 있는 사람은 누구나 열 수 있으므로 소유자 전용 페이지로 취급하세요.

        참고: 관리자 패널로는 사용자 보관함에 접근할 수 없으며, 오직 사용자 마스터 비밀번호만으로 가능합니다.

        **로그인 방법**

        **웹 브라우저**에서 보관함을 열면 먼저 Yundera 로그인, 그다음 보관함 마스터 비밀번호를 요청합니다.
        **Bitwarden 앱과 브라우저 확장 프로그램은 직접 연결**되므로 영향을 받지 않으며, 기존과 같이
        Vaultwarden 이메일과 마스터 비밀번호를 사용합니다.

        **📧 이메일 통합**

        Yundera의 내장 SMTP 서비스를 사용합니다:
        - **비밀번호 복구 이메일**이 즉시 작동
        - **계정 알림**이 자동으로 전송

        **첫 번째 단계:**

        1. **메인 계정 생성**: 설치 후 가입을 통해 첫 번째 사용자 계정을 생성하세요.

        2. **관리자 패널 접근**: [🔗 관리자 패널](https://vaultwarden-$APP_DOMAIN/admin)

        3. **인스턴스 보안**: 설정 완료 후 관리자 패널에서 새로운 가입을 비활성화하세요.

        **모바일/데스크톱 앱:**

        **Bitwarden 앱**을 다운로드하거나 **Bitwarden 브라우저 확장프로그램**을 사용하세요 - Vaultwarden과 완벽하게 작동합니다!
      zh_cn: |
        `如果您丢失主密码，**没有人能恢复您的数据**！您的保险库将永久无法访问。请妥善保管。`

        **管理员面板**

        | 设置 | 值 |
        |------|-----|
        | 管理员面板 | [🔗 管理员面板](https://vaultwarden-$APP_DOMAIN/admin) |
        | 登录方式 | 您的 Yundera 账户（单点登录） |

        **没有管理员令牌**需要复制或保管：管理员面板由本服务器的单点登录保护。
        任何能登录本服务器的人都可以打开它，请将其视为仅限所有者的页面。

        注意：管理员面板无法访问用户保险库，只有用户主密码才可以。

        **登录方式**

        在**网页浏览器**中打开保险库时，会先要求您登录 Yundera，然后输入保险库主密码。
        **Bitwarden 应用和浏览器扩展直接连接**，不受影响 --- 它们继续使用您的 Vaultwarden
        邮箱和主密码。

        **📧 邮件集成**

        此版本使用Yundera内置的SMTP服务：
        - **密码恢复邮件**立即可用
        - **账户通知**自动发送

        **首要步骤：**

        1. **创建主账户**: 安装后通过注册创建第一个用户账户。

        2. **访问管理员面板**: [🔗 管理员面板](https://vaultwarden-$APP_DOMAIN/admin)

        3. **保护实例安全**: 设置完成后在管理员面板中禁用新注册。

        **移动端/桌面端应用：**

        下载**Bitwarden应用**或使用**Bitwarden浏览器扩展** - 与Vaultwarden完美配合！
      fr_fr: |
