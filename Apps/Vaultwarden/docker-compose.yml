name: vaultwarden

services:
  # AppShield is the single front door. It terminates the three public routes and gates
  # every browser-facing path -- /admin included -- on the PCS's Authelia SSO, so the
  # admin panel no longer needs ADMIN_TOKEN. The Bitwarden client protocol surface is
  # exempted from the gate (ALLOWED_PATHS below); see rationale.md.
  vaultwarden:
    image: ghcr.io/yundera/appshield:3.0.2
    container_name: vaultwarden
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar independently attests this app's name via the
    # container's PTR record, rejecting any redirect URI that doesn't match. Must equal the
    # app name, or Docker defaults the hostname to the random container ID and OIDC
    # registration fails.
    hostname: vaultwarden
    restart: unless-stopped
    expose:
      - 80
    environment:
      BACKEND_HOST: "vaultwarden-backend"
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io"
      # Bitwarden's mobile, desktop and browser-extension clients authenticate with their
      # own bearer tokens and cannot run an OIDC browser flow, so the client protocol
      # surface has to bypass the gate. This is the full set of client-reachable route
      # mounts in Vaultwarden 1.37.0 (src/main.rs mounts + the root routes in
      # src/api/web.rs). `admin` is deliberately absent, which is what puts the admin
      # panel behind SSO -- a missing entry breaks a client loudly, it can never expose
      # /admin. See rationale.md.
      ALLOWED_PATHS: "api/,identity/,notifications/,events/,icons/,attachments/,.well-known/,app-id.json,alive"
      # Vaultwarden caps attachment size itself; don't let the gate be the lower limit.
      CLIENT_MAX_BODY_SIZE: "0"
    labels:
      caddy_0: vaultwarden-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: vaultwarden-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: vaultwarden-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    depends_on:
      - vaultwarden-backend
    deploy:
      resources:
        limits:
          memory: 128M
    cpu_shares: 80
    networks:
      - pcs

  vaultwarden-backend:
    image: vaultwarden/server:1.37.0
    container_name: vaultwarden-backend
    user: $PUID:$PGID
    deploy:
      resources:
        limits:
          memory: 1024M
    cpu_shares: 70
    # Checked from inside the container: /alive is a client protocol route, so it is
    # reachable whether or not the SSO gate is in front of it.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - 80
    # No caddy labels: the backend is reachable from outside only through AppShield.
    # It stays on `pcs` because it has to resolve the PCS mail gateway (SMTP_HOST: smtp),
    # which lives there -- so it is still reachable by other containers on the box. With
    # DISABLE_ADMIN_TOKEN that means a peer container on `pcs` can reach /admin directly;
    # see rationale.md for why that is not a regression against the shipped token.
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ROCKET_PORT: 80
      ROCKET_ADDRESS: 0.0.0.0
      SIGNUPS_ALLOWED: "true"
      # No ADMIN_TOKEN. Upstream: "Enable this to bypass the admin panel security. This
      # option is only meant to be used with the use of a separate auth layer in front."
      # AppShield is that layer -- /admin is not in ALLOWED_PATHS, so every request to it
      # is authenticated against the PCS SSO before Vaultwarden ever sees it.
      DISABLE_ADMIN_TOKEN: "true"
      DOMAIN: https://vaultwarden-$APP_DOMAIN
      APP_NET: pcs
      SMTP_HOST: smtp
      SMTP_PORT: 587
      SMTP_SECURITY: off
      SMTP_USERNAME: casaos
      SMTP_PASSWORD: $APP_DEFAULT_PASSWORD
      SMTP_FROM: vaultwarden@$APP_DOMAIN
      SMTP_FROM_NAME: Vaultwarden
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/vaultwarden/data/:/data/
    restart: unless-stopped
    networks:
      - pcs

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

