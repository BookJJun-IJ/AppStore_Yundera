name: docusaurus

services:
  docusaurus-init:
    image: node:20-alpine3.20
    container_name: docusaurus-init
    restart: "no"
    user: "0:0"
    cpu_shares: 50
    working_dir: /tmp
    volumes:
      - /DATA/AppData/$AppID/src/:/output
      - /DATA/AppData/$AppID/build/:/build-output
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ ! -f /output/.initialized ]; then
          echo "Initializing Docusaurus project..."
          npx create-docusaurus@3.10.1 site classic --javascript \
            && cp -r site/* /output/ \
            && rm -rf site \
            && touch /output/.initialized \
            && echo "Project initialized."
        fi
        echo "Building Docusaurus site..."
        cd /output \
          && npm run build \
          && cp -r build/* /build-output/ \
          && echo "Build complete."

  docusaurus:
    image: nginx:1.27-alpine
    container_name: docusaurus
    hostname: docusaurus
    restart: unless-stopped
    user: "0:0"
    expose:
      - "80"
    volumes:
      - /DATA/AppData/$AppID/build/:/usr/share/nginx/html/:ro
    depends_on:
      docusaurus-init:
        condition: service_completed_successfully
    cpu_shares: 50
    labels:
      caddy_0: docusaurus-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: docusaurus-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: docusaurus-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    networks:
      - pcs

networks:
  pcs:
    name: pcs
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  main: docusaurus
  store_app_id: docusaurus
  webui_port: 80
  index: /
  author: Yundera Team
  category: Utilities
  developer: Meta (Facebook)
  icon: https://cdn.jsdelivr.net/gh/Yundera/AppStore@main/Apps/Docusaurus/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/Yundera/AppStore@main/Apps/Docusaurus/screenshot-1.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/Yundera/AppStore@main/Apps/Docusaurus/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/Yundera/AppStore@main/Apps/Docusaurus/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/Yundera/AppStore@main/Apps/Docusaurus/screenshot-3.png
  title:
    en_us: Docusaurus
  tagline:
    en_us: SEO-ready documentation with FAQ rich results and geo-targeting
    fr_fr: Documentation optimisee SEO avec FAQ enrichies et ciblage geographique
    ko_kr: FAQ 리치 결과와 지역 타겟팅을 지원하는 SEO 최적화 문서 사이트
  description:
    en_us: |
      Docusaurus is a static site generator by Meta, optimized for SEO, FAQ rich results, and geo-targeting.

      **SEO Features:**
      - Schema.org structured data (Organization, WebSite, FAQPage)
      - Automatic sitemap and robots.txt generation
      - Open Graph and Twitter Card meta tags
      - Per-page SEO with frontmatter (title, description, keywords)

      **FAQ Rich Results:**
      - FAQPage JSON-LD schema for Google FAQ dropdowns
      - Questions appear directly in search results

      **Geo & i18n:**
      - Geo meta tags for regional search targeting
      - Built-in multi-language support with hreflang tags
      - Locale-specific URLs and sitemaps

      Also includes Markdown authoring, versioning, search, and dark mode.
    fr_fr: |
      Docusaurus est un generateur de sites statiques par Meta, optimise pour le SEO, les resultats enrichis FAQ et le ciblage geographique.

      **Fonctionnalites SEO :**
      - Donnees structurees Schema.org (Organization, WebSite, FAQPage)
      - Generation automatique de sitemap et robots.txt
      - Balises meta Open Graph et Twitter Card
      - SEO par page avec frontmatter (titre, description, mots-cles)

      **Resultats enrichis FAQ :**
      - Schema JSON-LD FAQPage pour les menus deroulants FAQ Google
      - Les questions apparaissent directement dans les resultats de recherche

      **Geo & i18n :**
      - Balises meta geo pour le ciblage regional
      - Support multilingue integre avec balises hreflang
      - URLs et sitemaps par langue

      Inclut egalement la redaction en Markdown, le versionnage, la recherche et le mode sombre.
    ko_kr: |
      Docusaurus는 Meta에서 만든 정적 사이트 생성기로, SEO, FAQ 리치 결과, 지역 타겟팅에 최적화되어 있습니다.

      **SEO 기능:**
      - Schema.org 구조화 데이터 (Organization, WebSite, FAQPage)
      - 자동 sitemap 및 robots.txt 생성
      - Open Graph 및 Twitter Card 메타 태그
      - 프론트매터를 통한 페이지별 SEO (제목, 설명, 키워드)

      **FAQ 리치 결과:**
      - Google FAQ 드롭다운을 위한 FAQPage JSON-LD 스키마
      - 검색 결과에 질문이 직접 표시됨

      **Geo & 다국어:**
      - 지역 검색 타겟팅을 위한 Geo 메타 태그
      - hreflang 태그를 포함한 내장 다국어 지원
      - 언어별 URL 및 사이트맵

      Markdown 작성, 버전 관리, 검색, 다크 모드도 지원합니다.
  tips:
    before_install:
      en_us: |
        **Warning:** This is a public documentation site with no login or authentication. Anyone with the address can read everything inside it. Only add content you are happy to share publicly, and never store private notes, credentials, or personal data here.

        A new Docusaurus project will be created on first install.
        Edit your docs in the File Manager at /DATA/AppData/docusaurus/src/docs/.
        To rebuild after editing, restart the app or use DocusaurusMCP's rebuild tool.
      fr_fr: |
        **Attention :** Ce site de documentation est public, sans authentification. Toute personne disposant de l'adresse peut lire son contenu. N'ajoutez que du contenu que vous acceptez de partager publiquement, et ne stockez jamais de notes privees, d'identifiants ou de donnees personnelles ici.

        Un nouveau projet Docusaurus sera cree lors de la premiere installation.
        Modifiez vos documents dans le gestionnaire de fichiers a /DATA/AppData/docusaurus/src/docs/.
        Pour reconstruire apres modification, redemarrez l'application ou utilisez l'outil rebuild de DocusaurusMCP.
      ko_kr: |
        **경고:** 이 문서 사이트는 로그인이나 인증 없이 공개됩니다. 주소를 아는 누구나 모든 내용을 읽을 수 있습니다. 공개해도 괜찮은 내용만 추가하고, 비공개 메모, 자격 증명, 개인 정보는 절대 저장하지 마세요.

        첫 설치 시 새로운 Docusaurus 프로젝트가 생성됩니다.
        /DATA/AppData/docusaurus/src/docs/ 경로에서 파일 매니저를 통해 문서를 편집할 수 있습니다.
        편집 후 반영하려면 앱을 재시작하거나 DocusaurusMCP의 rebuild 도구를 사용하세요.

x-compose-app:
  webui-host: docusaurus-${domain}
